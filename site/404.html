<title>없는 주소 · MEVI</title>
<!-- 주소 끝의 ?v= 숫자는 아이콘을 바꿀 때마다 올립니다. 브라우저가 예전 아이콘을 캐시에서 계속 쓰지 않게 합니다. -->
<link rel="icon" href="/favicon.ico?v=2" sizes="48x48">
<link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml">
<script>
/* /about 처럼 들어온 주소는 /#/about 화면으로 보냅니다. */
(function(){
  var p = location.pathname.replace(/^\/+|\/+$/g, "");
  if(/^(about|services|campusscanner|swapstay|work|people|news)(\/(release|dev|team))?$/.test(p)) location.replace("/#/" + p);
})();
</script>

a{display:inline-flex;align-items:center;min-height:48px;padding:0 22px;border-radius:999px;background:#BA4419;color:#fff;font-weight:700;text-decoration:none}

</style>
</head>
